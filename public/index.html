<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion Sous-Traitance</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1220;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 1px solid var(--border); }
    }

    aside {
      background: var(--panel-2);
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .schema-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 12px 8px 6px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .nav-btn:hover { background: rgba(255,255,255,0.05); }
    .nav-btn.active {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
      font-weight: 600;
    }

    main {
      padding: 24px;
      overflow-x: auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .title-group h1 {
      margin: 0;
      font-size: 22px;
    }

    .title-group p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    input[type="text"], input[type="number"], input[type="date"], input[type="password"], select, textarea {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #293548; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:hover td { background: rgba(255, 255, 255, 0.03); }

    .actions-cell {
      display: flex;
      gap: 6px;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.35);
    }

    .banner {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .banner.error {
      border-color: rgba(239, 68, 68, 0.5);
      background: rgba(239, 68, 68, 0.12);
      color: #fecaca;
    }

    .banner.warn {
      border-color: rgba(245, 158, 11, 0.45);
      background: rgba(245, 158, 11, 0.12);
      color: #fde68a;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }

    .modal h2 {
      margin: 0 0 16px;
      font-size: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .login-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 380px;
    }

    .null-badge {
      color: var(--muted);
      font-style: italic;
      font-size: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="login-view" class="login-screen" style="display:none;">
    <form id="login-form" class="login-box">
      <h2 style="margin-top:0;">Connexion</h2>
      <p style="color:var(--muted);font-size:14px;">Entrez le mot de passe du site pour accéder aux données.</p>
      <div id="login-error" class="banner error" style="display:none;"></div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input id="login-password" type="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;">Se connecter</button>
    </form>
  </div>

  <div id="app-view" class="app" style="display:none;">
    <aside>
      <div class="brand">Base de données</div>
      <div id="tables-nav"></div>
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px;">
        <button id="logout-btn" class="btn-secondary" style="display:none;">Déconnexion</button>
      </div>
    </aside>

    <main>
      <div id="global-notice" class="banner warn" style="display:none;"></div>
      <div id="global-error" class="banner error" style="display:none;"></div>

      <div class="topbar">
        <div class="title-group">
          <h1 id="current-title">Chargement...</h1>
          <p id="current-subtitle"></p>
        </div>
        <div class="toolbar">
          <input id="search-input" type="text" placeholder="Rechercher..." />
          <button id="refresh-btn" class="btn-secondary">Actualiser</button>
          <button id="add-btn" class="btn-primary">+ Ajouter</button>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span id="page-info">0 résultat</span>
          <div style="display:flex;gap:8px;">
            <button id="prev-page" class="btn-secondary btn-sm">Précédent</button>
            <button id="next-page" class="btn-secondary btn-sm">Suivant</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop">
    <form id="row-form" class="modal">
      <h2 id="modal-title">Ajouter</h2>
      <div id="modal-error" class="banner error" style="display:none;"></div>
      <div id="modal-fields"></div>
      <div class="modal-footer">
        <button type="button" id="modal-cancel" class="btn-secondary">Annuler</button>
        <button type="submit" class="btn-primary" id="modal-save">Enregistrer</button>
      </div>
    </form>
  </div>

  <script>
    const state = {
      tables: [],
      current: null,
      columns: [],
      primaryKeys: [],
      fkOptions: {},
      rows: [],
      total: 0,
      page: 1,
      pageSize: 25,
      search: '',
      editingKey: null,
    };

    function escapeHtml(val) {
      return String(val)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showError(msg) {
      const el = document.getElementById('global-error');
      if (!msg) {
        el.style.display = 'none';
        el.textContent = '';
      } else {
        el.style.display = 'block';
        el.textContent = msg;
      }
    }

    async function api(url, options = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(json.error || `Erreur HTTP ${res.status}`);
        err.status = res.status;
        throw err;
      }
      return json;
    }

    function formatCell(val, col) {
      if (val === null || val === undefined) {
        return '<span class="null-badge">vide</span>';
      }
      if (typeof val === 'boolean') {
        return val ? 'Oui' : 'Non';
      }
      if (col.dataType === 'date' && typeof val === 'string') {
        return escapeHtml(val.slice(0, 10));
      }
      if (typeof val === 'object') {
        return escapeHtml(JSON.stringify(val));
      }
      return escapeHtml(String(val));
    }

    function renderSidebar() {
      const nav = document.getElementById('tables-nav');
      if (state.tables.length === 0) {
        nav.innerHTML = '<p style="color:var(--muted);font-size:13px;">Aucune table trouvée.</p>';
        return;
      }

      const bySchema = new Map();
      for (const t of state.tables) {
        if (!bySchema.has(t.table_schema)) bySchema.set(t.table_schema, []);
        bySchema.get(t.table_schema).push(t.table_name);
      }

      let html = '';
      for (const [schema, names] of bySchema.entries()) {
        html += `<div class="schema-title">${escapeHtml(schema)}</div>`;
        for (const name of names) {
          const active =
            state.current &&
            state.current.schema === schema &&
            state.current.table === name;
          html += `
            <button class="nav-btn ${active ? 'active' : ''}" data-schema="${escapeHtml(schema)}" data-table="${escapeHtml(name)}">
              <span>${escapeHtml(name)}</span>
            </button>
          `;
        }
      }
      nav.innerHTML = html;

      nav.querySelectorAll('.nav-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.current = { schema: btn.dataset.schema, table: btn.dataset.table };
          state.page = 1;
          state.search = '';
          document.getElementById('search-input').value = '';
          renderSidebar();
          loadRows();
        });
      });
    }

    function renderTable() {
      const head = document.getElementById('table-head');
      const body = document.getElementById('table-body');
      const pageInfo = document.getElementById('page-info');

      if (!state.current) return;

      document.getElementById('current-title').textContent = state.current.table;
      document.getElementById('current-subtitle').textContent = `Schéma : ${state.current.schema}`;

      head.innerHTML = `
        <tr>
          ${state.columns.map((c) => `<th>${escapeHtml(c.name)}</th>`).join('')}
          <th>Actions</th>
        </tr>
      `;

      if (state.rows.length === 0) {
        body.innerHTML = `
          <tr>
            <td colspan="${state.columns.length + 1}" class="empty-state">
              Aucune donnée trouvée.
            </td>
          </tr>
        `;
      } else {
        body.innerHTML = state.rows
          .map((row, idx) => {
            const tds = state.columns
              .map((col) => `<td title="${escapeHtml(row.data[col.name] ?? '')}">${formatCell(row.data[col.name], col)}</td>`)
              .join('');
            return `
              <tr>
                ${tds}
                <td>
                  <div class="actions-cell">
                    <button class="btn-secondary btn-sm" data-edit="${idx}">Modifier</button>
                    <button class="btn-danger btn-sm" data-delete="${idx}">Supprimer</button>
                  </div>
                </td>
              </tr>
            `;
          })
          .join('');
      }

      const start = state.total === 0 ? 0 : (state.page - 1) * state.pageSize + 1;
      const end = Math.min(state.total, state.page * state.pageSize);
      pageInfo.textContent = `${start}–${end} sur ${state.total} ligne(s)`;

      document.getElementById('prev-page').disabled = state.page <= 1;
      document.getElementById('next-page').disabled = state.page * state.pageSize >= state.total;

      body.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', () => openModal(state.rows[Number(btn.dataset.edit)]));
      });

      body.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', () => deleteRow(state.rows[Number(btn.dataset.delete)]));
      });
    }

    async function loadRows() {
      if (!state.current) return;
      showError('');
      try {
        const { schema, table } = state.current;
        const params = new URLSearchParams({
          page: String(state.page),
          pageSize: String(state.pageSize),
          search: state.search,
        });
        const res = await api(
          `/api/tables/${encodeURIComponent(schema)}/${encodeURIComponent(table)}/rows?${params}`
        );
        state.columns = res.columns;
        state.primaryKeys = res.primaryKeys;
        state.fkOptions = res.fkOptions || {};
        state.rows = res.rows;
        state.total = res.total;
        renderTable();
      } catch (err) {
        showError(err.message);
      }
    }

    function openModal(row = null) {
      state.editingKey = row ? row.key : null;
      document.getElementById('modal-title').textContent = row
        ? `Modifier (${state.current.table})`
        : `Ajouter dans ${state.current.table}`;

      const errEl = document.getElementById('modal-error');
      errEl.style.display = 'none';
      errEl.textContent = '';

      const fieldsEl = document.getElementById('modal-fields');
      fieldsEl.innerHTML = state.columns
        .map((col) => {
          const existingVal = row ? row.data[col.name] : '';
          const isEdit = Boolean(row);

          if (!isEdit && col.isAutoGenerated) {
            return '';
          }

          const requiredAttr = !col.nullable && !col.defaultValue && !col.isAutoGenerated ? 'required' : '';
          const readonlyAttr = isEdit && col.isAutoGenerated ? 'readonly' : '';
          const typeLabel = col.nullable ? 'optionnel' : 'obligatoire';

          const fkList = state.fkOptions[col.name];
          if (fkList && fkList.length > 0 && !(isEdit && col.isAutoGenerated)) {
            const opts = [
              col.nullable ? '<option value="">-- Aucun --</option>' : '<option value="">-- Choisir --</option>',
              ...fkList.map((opt) => {
                const selected = String(existingVal ?? '') === String(opt.value) ? 'selected' : '';
                const text =
                  String(opt.label) !== String(opt.value)
                    ? `${opt.value} — ${opt.label}`
                    : `${opt.value}`;
                return `<option value="${escapeHtml(opt.value)}" ${selected}>${escapeHtml(text)}</option>`;
              }),
            ].join('');
            return `
              <div class="field">
                <label>${escapeHtml(col.name)} <span>${typeLabel}</span></label>
                <select name="${escapeHtml(col.name)}" ${requiredAttr}>${opts}</select>
              </div>
            `;
          }

          if (col.dataType === 'boolean') {
            const valStr = existingVal === true ? 'true' : existingVal === false ? 'false' : '';
            return `
              <div class="field">
                <label>${escapeHtml(col.name)} <span>${typeLabel}</span></label>
                <select name="${escapeHtml(col.name)}" ${requiredAttr}>
                  ${col.nullable ? `<option value="" ${valStr === '' ? 'selected' : ''}>-- Vide --</option>` : ''}
                  <option value="true" ${valStr === 'true' ? 'selected' : ''}>Oui (true)</option>
                  <option value="false" ${valStr === 'false' ? 'selected' : ''}>Non (false)</option>
                </select>
              </div>
            `;
          }

          if (col.dataType === 'date') {
            const dateVal = existingVal ? String(existingVal).slice(0, 10) : '';
            return `
              <div class="field">
                <label>${escapeHtml(col.name)} <span>${typeLabel}</span></label>
                <input type="date" name="${escapeHtml(col.name)}" value="${escapeHtml(dateVal)}" ${requiredAttr} ${readonlyAttr} />
              </div>
            `;
          }

          if (['smallint', 'integer', 'bigint', 'numeric', 'decimal', 'real', 'double precision'].includes(col.dataType)) {
            const step = ['smallint', 'integer', 'bigint'].includes(col.dataType) ? '1' : 'any';
            return `
              <div class="field">
                <label>${escapeHtml(col.name)} <span>${typeLabel}</span></label>
                <input type="number" step="${step}" name="${escapeHtml(col.name)}" value="${escapeHtml(existingVal ?? '')}" ${requiredAttr} ${readonlyAttr} />
              </div>
            `;
          }

          if (col.dataType === 'text' || col.dataType === 'json' || col.dataType === 'jsonb') {
            const strVal =
              typeof existingVal === 'object' && existingVal !== null
                ? JSON.stringify(existingVal, null, 2)
                : String(existingVal ?? '');
            return `
              <div class="field">
                <label>${escapeHtml(col.name)} <span>${typeLabel}</span></label>
                <textarea rows="3" name="${escapeHtml(col.name)}" ${requiredAttr} ${readonlyAttr}>${escapeHtml(strVal)}</textarea>
              </div>
            `;
          }

          return `
            <div class="field">
              <label>${escapeHtml(col.name)} <span>${typeLabel}</span></label>
              <input type="text" name="${escapeHtml(col.name)}" value="${escapeHtml(existingVal ?? '')}" ${requiredAttr} ${readonlyAttr} />
            </div>
          `;
        })
        .join('');

      document.getElementById('modal-backdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    async function deleteRow(row) {
      if (!confirm('Supprimer cette ligne définitivement ?')) return;
      try {
        const { schema, table } = state.current;
        await api(`/api/tables/${encodeURIComponent(schema)}/${encodeURIComponent(table)}/rows`, {
          method: 'DELETE',
          body: JSON.stringify({ key: row.key }),
        });
        await loadRows();
      } catch (err) {
        showError(err.message);
      }
    }

    async function loadApp() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('app-view').style.display = 'grid';

      try {
        const res = await api('/api/tables');
        state.tables = res.tables;
        if (state.tables.length > 0 && !state.current) {
          state.current = {
            schema: state.tables[0].table_schema,
            table: state.tables[0].table_name,
          };
        }
        renderSidebar();
        await loadRows();
      } catch (err) {
        showError(err.message);
      }
    }

    async function init() {
      try {
        const auth = await api('/api/auth/status');
        if (!auth.passwordRequired) {
          const notice = document.getElementById('global-notice');
          notice.style.display = 'block';
          notice.textContent =
            'Conseil : ajoutez la variable APP_PASSWORD dans Railway pour protéger le site par mot de passe.';
        } else {
          document.getElementById('logout-btn').style.display = 'block';
        }

        if (auth.passwordRequired && !auth.authenticated) {
          document.getElementById('login-view').style.display = 'flex';
          document.getElementById('app-view').style.display = 'none';
        } else {
          await loadApp();
        }
      } catch (err) {
        showError(err.message);
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      try {
        await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ password: document.getElementById('login-password').value }),
        });
        await loadApp();
      } catch (err) {
        errEl.style.display = 'block';
        errEl.textContent = err.message;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      location.reload();
    });

    document.getElementById('add-btn').addEventListener('click', () => openModal(null));
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('refresh-btn').addEventListener('click', loadRows);

    let searchTimer = null;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.search = e.target.value;
        state.page = 1;
        loadRows();
      }, 250);
    });

    document.getElementById('prev-page').addEventListener('click', () => {
      if (state.page > 1) {
        state.page -= 1;
        loadRows();
      }
    });

    document.getElementById('next-page').addEventListener('click', () => {
      if (state.page * state.pageSize < state.total) {
        state.page += 1;
        loadRows();
      }
    });

    document.getElementById('row-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('modal-error');
      errEl.style.display = 'none';

      const formData = new FormData(e.target);
      const data = {};
      for (const [k, v] of formData.entries()) {
        data[k] = v;
      }

      try {
        const { schema, table } = state.current;
        if (state.editingKey) {
          await api(`/api/tables/${encodeURIComponent(schema)}/${encodeURIComponent(table)}/rows`, {
            method: 'PUT',
            body: JSON.stringify({ key: state.editingKey, data }),
          });
        } else {
          await api(`/api/tables/${encodeURIComponent(schema)}/${encodeURIComponent(table)}/rows`, {
            method: 'POST',
            body: JSON.stringify({ data }),
          });
        }
        closeModal();
        await loadRows();
      } catch (err) {
        errEl.style.display = 'block';
        errEl.textContent = err.message;
      }
    });

    init();
  </script>
</body>
</html>
